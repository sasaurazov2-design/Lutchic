name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Replit junk and create clean config
        run: |
          rm -f pnpm-workspace.yaml
          rm -f vite.config.ts
          
          # Создаем чистейший конфиг без ошибок и дублей
          echo "import { defineConfig } from 'vite'; import react from '@vitejs/plugin-react'; export default defineConfig({ plugins: [react()] });" > vite.config.ts

          find . -name "package.json" -exec sed -i '/@workspace\//d' {} +
          find . -name "package.json" -exec sed -i 's/"catalog:[^"]*"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i 's/"catalog:"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i 's/"workspace:\*"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i '/@replit\//d' {} +

      - name: Install dependencies and build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
        env:
          BASE_PATH: '/'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: lutchic.de5.net

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Replit junk and catalogs
        run: |
          rm -f pnpm-workspace.yaml
          find . -name "package.json" -exec sed -i 's/"catalog:[^"]*"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i 's/"catalog:"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i 's/"workspace:\*"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i '/@replit\//d' {} +

      - name: Install dependencies and build inside package dir
        run: |
          cd artifacts/lutchic-socials
          pnpm install --no-frozen-lockfile
          pnpm run build
        env:
          BASE_PATH: '/'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/lutchic-socials/dist/public
          cname: lutchic.de5.net

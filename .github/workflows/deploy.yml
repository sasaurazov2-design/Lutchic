name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Replit junk and create valid configs
        run: |
          rm -f pnpm-workspace.yaml vite.config.ts tsconfig.base.json tsconfig.json

          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import path from 'path';

          export default defineConfig({
            plugins: [react()],
            base: '/',
            resolve: {
              alias: {
                '@': path.resolve(__dirname, './src'),
              },
            },
          });
          EOF

          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": false,
              "baseUrl": ".",
              "paths": {
                "@/*": ["./src/*"]
              }
            },
            "include": ["src"]
          }
          EOF

          find . -name "package.json" -type f -exec sed -i 's/"build":\s*"[^"]*"/"build": "vite build"/g' {} +
          find . -name "package.json" -type f -exec sed -i '/@workspace\//d' {} +
          find . -name "package.json" -type f -exec sed -i 's/"catalog:[^"]*"/"latest"/g' {} +
          find . -name "package.json" -type f -exec sed -i 's/"catalog:"/"latest"/g' {} +
          find . -name "package.json" -type f -exec sed -i 's/"workspace:\*"/"latest"/g' {} +
          find . -name "package.json" -type f -exec sed -i '/@replit\//d' {} +

      - name: Install dependencies and build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: '/'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: lutchic.de5.net

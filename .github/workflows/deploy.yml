name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force clean build script and remove configs
        run: |
          rm -f pnpm-workspace.yaml
          rm -f vite.config.ts
          rm -f tsconfig.base.json

          # Принудительно перезаписываем скрипт build во всех package.json на чистый vite build
          node -e '
            const fs = require("fs");
            const glob = require("glob");
            // Простая рекурсивная замена в package.json
            const walk = (dir) => {
              fs.readdirSync(dir).forEach(file => {
                const path = dir + "/" + file;
                if (fs.statSync(path).isDirectory()) {
                  if (file !== "node_modules" && file !== ".git") walk(path);
                } else if (file === "package.json") {
                  let content = JSON.parse(fs.readFileSync(path, "utf8"));
                  if (content.scripts && content.scripts.build) {
                    content.scripts.build = "vite build";
                    fs.writeFileSync(path, JSON.stringify(content, null, 2));
                    console.log("Updated build script in " + path);
                  }
                }
              });
            };
            walk(".");
          '

          find . -name "package.json" -exec sed -i '/@workspace\//d' {} +
          find . -name "package.json" -exec sed -i 's/"catalog:[^"]*"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i 's/"catalog:"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i 's/"workspace:\*"/"latest"/g' {} +
          find . -name "package.json" -exec sed -i '/@replit\//d' {} +

      - name: Install dependencies and build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
        env:
          BASE_PATH: '/'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: lutchic.de5.net
